<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/brand/logo-transparent.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri + React + Typescript</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        background: var(--mk-canvas, #fefcf7);
      }

      .boot-screen {
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        background: #fefcf7;
      }

      .mk-boot-loader {
        --dur: 1s;
        position: relative;
        width: 12em;
        height: 12em;
        font-size: 14px;
        transform: scale(0.67);
        transform-origin: center;
      }

      .mk-boot-loader .wheel,
      .mk-boot-loader .hamster,
      .mk-boot-loader .hamster div,
      .mk-boot-loader .spoke {
        position: absolute;
      }

      .mk-boot-loader .wheel,
      .mk-boot-loader .spoke {
        border-radius: 50%;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      .mk-boot-loader .wheel {
        background: radial-gradient(100% 100% at center, hsla(0, 0%, 60%, 0) 47.8%, hsl(0, 0%, 60%) 48%);
        z-index: 2;
      }

      .mk-boot-loader .hamster {
        animation: mk-hamster var(--dur) ease-in-out infinite;
        top: 50%;
        left: calc(50% - 3.5em);
        width: 7em;
        height: 3.75em;
        transform: rotate(4deg) translate(-0.8em, 1.85em);
        transform-origin: 50% 0;
        z-index: 1;
      }

      .mk-boot-loader .hamster__head {
        animation: mk-hamster-head var(--dur) ease-in-out infinite;
        background: hsl(30, 90%, 55%);
        border-radius: 70% 30% 0 100% / 40% 25% 25% 60%;
        box-shadow: 0 -0.25em 0 hsl(30, 90%, 80%) inset, 0.75em -1.55em 0 hsl(30, 90%, 90%) inset;
        top: 0;
        left: -2em;
        width: 2.75em;
        height: 2.5em;
        transform-origin: 100% 50%;
      }

      .mk-boot-loader .hamster__ear {
        animation: mk-hamster-ear var(--dur) ease-in-out infinite;
        background: hsl(0, 90%, 85%);
        border-radius: 50%;
        box-shadow: -0.25em 0 hsl(30, 90%, 55%) inset;
        top: -0.25em;
        right: -0.25em;
        width: 0.75em;
        height: 0.75em;
        transform-origin: 50% 75%;
      }

      .mk-boot-loader .hamster__eye {
        animation: mk-hamster-eye var(--dur) linear infinite;
        background-color: hsl(0, 0%, 0%);
        border-radius: 50%;
        top: 0.375em;
        left: 1.25em;
        width: 0.5em;
        height: 0.5em;
      }

      .mk-boot-loader .hamster__nose {
        background: hsl(0, 90%, 75%);
        border-radius: 35% 65% 85% 15% / 70% 50% 50% 30%;
        top: 0.75em;
        left: 0;
        width: 0.2em;
        height: 0.25em;
      }

      .mk-boot-loader .hamster__body {
        animation: mk-hamster-body var(--dur) ease-in-out infinite;
        background: hsl(30, 90%, 90%);
        border-radius: 50% 30% 50% 30% / 15% 60% 40% 40%;
        box-shadow: 0.1em 0.75em 0 hsl(30, 90%, 55%) inset, 0.15em -0.5em 0 hsl(30, 90%, 80%) inset;
        top: 0.25em;
        left: 2em;
        width: 4.5em;
        height: 3em;
        transform-origin: 17% 50%;
        transform-style: preserve-3d;
      }

      .mk-boot-loader .hamster__limb--fr,
      .mk-boot-loader .hamster__limb--fl {
        clip-path: polygon(0 0, 100% 0, 70% 80%, 60% 100%, 0% 100%, 40% 80%);
        top: 2em;
        left: 0.5em;
        width: 1em;
        height: 1.5em;
        transform-origin: 50% 0;
      }

      .mk-boot-loader .hamster__limb--fr {
        animation: mk-hamster-fr-limb var(--dur) linear infinite;
        background: linear-gradient(hsl(30, 90%, 80%) 80%, hsl(0, 90%, 75%) 80%);
        transform: rotate(15deg) translateZ(-1px);
      }

      .mk-boot-loader .hamster__limb--fl {
        animation: mk-hamster-fl-limb var(--dur) linear infinite;
        background: linear-gradient(hsl(30, 90%, 90%) 80%, hsl(0, 90%, 85%) 80%);
        transform: rotate(15deg);
      }

      .mk-boot-loader .hamster__limb--br,
      .mk-boot-loader .hamster__limb--bl {
        border-radius: 0.75em 0.75em 0 0;
        clip-path: polygon(0 0, 100% 0, 100% 30%, 70% 90%, 70% 100%, 30% 100%, 40% 90%, 0% 30%);
        top: 1em;
        left: 2.8em;
        width: 1.5em;
        height: 2.5em;
        transform-origin: 50% 30%;
      }

      .mk-boot-loader .hamster__limb--br {
        animation: mk-hamster-br-limb var(--dur) linear infinite;
        background: linear-gradient(hsl(30, 90%, 80%) 90%, hsl(0, 90%, 75%) 90%);
        transform: rotate(-25deg) translateZ(-1px);
      }

      .mk-boot-loader .hamster__limb--bl {
        animation: mk-hamster-bl-limb var(--dur) linear infinite;
        background: linear-gradient(hsl(30, 90%, 90%) 90%, hsl(0, 90%, 85%) 90%);
        transform: rotate(-25deg);
      }

      .mk-boot-loader .hamster__tail {
        animation: mk-hamster-tail var(--dur) linear infinite;
        background: hsl(0, 90%, 85%);
        border-radius: 0.25em 50% 50% 0.25em;
        box-shadow: 0 -0.2em 0 hsl(0, 90%, 75%) inset;
        top: 1.5em;
        right: -0.5em;
        width: 1em;
        height: 0.5em;
        transform: rotate(30deg) translateZ(-1px);
        transform-origin: 0.25em 0.25em;
      }

      .mk-boot-loader .spoke {
        animation: mk-spoke var(--dur) linear infinite;
        background: radial-gradient(100% 100% at center, hsl(0, 0%, 60%) 4.8%, hsla(0, 0%, 60%, 0) 5%), linear-gradient(hsla(0, 0%, 55%, 0) 46.9%, hsl(0, 0%, 65%) 47% 52.9%, hsla(0, 0%, 65%, 0) 53%) 50% 50% / 99% 99% no-repeat;
      }

      @keyframes mk-hamster {
        from, to { transform: rotate(4deg) translate(-0.8em, 1.85em); }
        50% { transform: rotate(0) translate(-0.8em, 1.85em); }
      }

      @keyframes mk-hamster-head {
        from, 25%, 50%, 75%, to { transform: rotate(0); }
        12.5%, 37.5%, 62.5%, 87.5% { transform: rotate(8deg); }
      }

      @keyframes mk-hamster-eye {
        from, 90%, to { transform: scaleY(1); }
        95% { transform: scaleY(0); }
      }

      @keyframes mk-hamster-ear {
        from, 25%, 50%, 75%, to { transform: rotate(0); }
        12.5%, 37.5%, 62.5%, 87.5% { transform: rotate(12deg); }
      }

      @keyframes mk-hamster-body {
        from, 25%, 50%, 75%, to { transform: rotate(0); }
        12.5%, 37.5%, 62.5%, 87.5% { transform: rotate(-2deg); }
      }

      @keyframes mk-hamster-fr-limb {
        from, 25%, 50%, 75%, to { transform: rotate(50deg) translateZ(-1px); }
        12.5%, 37.5%, 62.5%, 87.5% { transform: rotate(-30deg) translateZ(-1px); }
      }

      @keyframes mk-hamster-fl-limb {
        from, 25%, 50%, 75%, to { transform: rotate(-30deg); }
        12.5%, 37.5%, 62.5%, 87.5% { transform: rotate(50deg); }
      }

      @keyframes mk-hamster-br-limb {
        from, 25%, 50%, 75%, to { transform: rotate(-60deg) translateZ(-1px); }
        12.5%, 37.5%, 62.5%, 87.5% { transform: rotate(20deg) translateZ(-1px); }
      }

      @keyframes mk-hamster-bl-limb {
        from, 25%, 50%, 75%, to { transform: rotate(20deg); }
        12.5%, 37.5%, 62.5%, 87.5% { transform: rotate(-60deg); }
      }

      @keyframes mk-hamster-tail {
        from, 25%, 50%, 75%, to { transform: rotate(30deg) translateZ(-1px); }
        12.5%, 37.5%, 62.5%, 87.5% { transform: rotate(10deg) translateZ(-1px); }
      }

      @keyframes mk-spoke {
        from { transform: rotate(0); }
        to { transform: rotate(-1turn); }
      }

      @media (prefers-reduced-motion: reduce) {
        .mk-boot-loader * {
          animation: none !important;
        }
      }
    </style>
    <script>
      // 在 CSS/React 加载前提前设置主题，避免弹出窗口出现白→黑→白闪烁
      (function () {
        try {
          var t = localStorage.getItem('mk-theme');
          var lt = localStorage.getItem('mk-light-theme');
          var dt = localStorage.getItem('mk-dark-theme');
          var ac = localStorage.getItem('mk-accent-skin');
          var root = document.documentElement;
          if (t) root.setAttribute('data-theme', t);
          if (lt) root.setAttribute('data-light-theme', lt);
          if (dt) root.setAttribute('data-dark-theme', dt);
          if (ac) root.setAttribute('data-accent-skin', ac);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"><div class="boot-screen" aria-label="正在加载" role="img">
      <div class="mk-boot-loader">
        <div class="wheel"></div>
        <div class="hamster">
          <div class="hamster__body">
            <div class="hamster__head">
              <div class="hamster__ear"></div>
              <div class="hamster__eye"></div>
              <div class="hamster__nose"></div>
            </div>
            <div class="hamster__limb hamster__limb--fr"></div>
            <div class="hamster__limb hamster__limb--fl"></div>
            <div class="hamster__limb hamster__limb--br"></div>
            <div class="hamster__limb hamster__limb--bl"></div>
            <div class="hamster__tail"></div>
          </div>
        </div>
        <div class="spoke"></div>
      </div>
    </div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
